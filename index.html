<style>
:root{--bg:#0B0E14;--card:#12161F;--line:#1E2430;--accent:#E10600;--text:#F5F5F5;--muted:#9AA3B2;--r:12px;--cols-d:3;--cols-m:2;--font:'Cairo';--shadow:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font),system-ui,sans-serif;font-size:1rem;line-height:1.7;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.35;margin:0 0 .5em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.container{width:min(1200px,92%);margin-inline:auto}
.only-mobile{display:none!important}
@media(max-width:820px){.only-mobile{display:inline-flex!important}.no-mobile{display:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.geo{position:relative;overflow:hidden}
.geo::before,.geo::after{content:"";position:absolute;width:230px;height:230px;pointer-events:none;opacity:.55;
 background:
  linear-gradient(135deg,transparent 48.5%,var(--accent) 49%,var(--accent) 51%,transparent 51.5%) 0 0/100% 100% no-repeat,
  linear-gradient(135deg,transparent 48.5%,var(--accent) 49%,var(--accent) 51%,transparent 51.5%) 46px 46px/100% 100% no-repeat,
  linear-gradient(135deg,transparent 48.5%,var(--accent) 49%,var(--accent) 51%,transparent 51.5%) 92px 92px/100% 100% no-repeat;}
.geo::before{inset-inline-end:-70px;top:-70px}
.geo::after{inset-inline-start:-70px;bottom:-70px;transform:rotate(180deg)}
#splash{position:fixed;inset:0;background:var(--bg);z-index:200;display:grid;place-items:center;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{font-size:56px;font-weight:900;color:var(--accent);letter-spacing:2px;animation:pop .8s ease}
.splash-lines{position:absolute;width:220px;opacity:.7}
.splash-lines path{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{from{transform:scale(.6);opacity:0}}
.header{position:sticky;top:0;z-index:60;background:rgba(11,14,20,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.header-in{display:flex;align-items:center;gap:18px;height:64px}
.logo{font-weight:900;font-size:26px;color:var(--accent);cursor:pointer;user-select:none;letter-spacing:1px}
.topnav{display:flex;gap:6px;margin-inline-start:auto}
.topnav a{padding:8px 14px;border-radius:10px;color:var(--muted);font-size:.95rem;font-weight:500;transition:.25s}
.topnav a:hover,.topnav a.active{color:var(--text);background:var(--card)}
.topnav a.active{color:var(--accent)}

.header-actions{display:flex;gap:8px;margin-inline-start:auto;align-items:center}
.topnav+.header-actions{margin-inline-start:0}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:.25s;color:var(--muted)}
.icon-btn:hover{color:var(--text);border-color:var(--accent)}
.icon-btn svg{width:20px;height:20px}
.engineer-badge{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 6px;cursor:default}
.engineer-badge .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#8b0000);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85rem}
.engineer-badge .info{display:flex;flex-direction:column;line-height:1.2}
.engineer-badge .info b{font-size:.82rem;color:var(--text)}

.social-icons{display:flex;gap:6px;align-items:center}
.social-icons a{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted);transition:.25s}
.social-icons a:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
.social-icons a.wa:hover{color:#25D366;border-color:#25D366}
.social-icons a.ig:hover{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;border-color:transparent}
.social-icons a.x:hover{color:#000;background:#fff;border-color:#fff}
.social-icons a.fb:hover{color:#1877F2;border-color:#1877F2}
.social-icons a.mail:hover{color:#EA4335;border-color:#EA4335}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;opacity:0;transition:.3s}
.overlay.show{opacity:1}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(300px,84vw);background:var(--card);border-inline-end:1px solid var(--line);z-index:90;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;padding:18px}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer-nav{display:flex;flex-direction:column;gap:4px}
.drawer-nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;color:var(--muted);font-weight:500;transition:.25s}
.drawer-nav a svg{width:20px;height:20px}
.drawer-nav a:hover,.drawer-nav a.active{background:var(--bg);color:var(--text)}
.drawer-nav a.active{color:var(--accent)}
.drawer-engineer{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.drawer-engineer .av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#8b0000);display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.1rem;flex-shrink:0}
.drawer-engineer .info{flex:1}
.drawer-engineer .info b{display:block;font-size:.95rem;color:var(--text)}
.drawer-engineer .info small{font-size:.72rem;color:var(--muted)}
.drawer-social{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.drawer-social .social-icons{justify-content:center;gap:10px}
.drawer-social .social-icons a{width:42px;height:42px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:70;background:rgba(18,22,31,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:10px;color:var(--muted);font-size:.68rem;transition:.25s}

.bottomnav a.active{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:12px 26px;font-weight:700;font-size:.95rem;cursor:pointer;transition:.25s;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.sm{padding:8px 18px;font-size:.85rem}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:#3a1113;color:#ff8a8a;border:1px solid #5b1a1d;box-shadow:none}
.btn svg{width:17px;height:17px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 18px;font-size:.85rem;cursor:pointer;transition:.25s;font-weight:500}
.chip:hover{color:var(--text)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.link-accent{color:var(--accent);font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:none;border:none}
.app{min-height:70vh;padding-bottom:70px}
@media(max-width:820px){.app{padding-bottom:120px}}
.section{padding:56px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.section-title{font-size:1.35rem;font-weight:800;position:relative;padding-inline-start:14px}
.section-title::before{content:"";position:absolute;inset-inline-start:0;top:15%;bottom:15%;width:4px;border-radius:4px;background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.28s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.grid{display:grid;grid-template-columns:repeat(var(--cols-m),1fr);gap:14px}
@media(min-width:821px){.grid{grid-template-columns:repeat(var(--cols-d),1fr);gap:18px}}
.dcard .thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:#0e1219}
.dcard .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.dcard:hover .thumb img{transform:scale(1.06)}

.like-btn{position:absolute;top:10px;inset-inline-start:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:none;background:rgba(11,14,20,.6);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer;transition:.25s}

.like-btn.pulse{animation:pulse .45s ease}

.like-count{position:absolute;top:14px;inset-inline-start:50px;z-index:2;font-size:.72rem;color:#fff;background:rgba(11,14,20,.55);padding:2px 8px;border-radius:99px;backdrop-filter:blur(6px)}
.hero{position:relative;min-height:430px;display:flex;align-items:center;border-block:1px solid var(--line);overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center}

.hero-in{position:relative;z-index:2;padding:70px 0}
.hero h1{font-size:clamp(1.9rem,5vw,3.2rem);font-weight:900;margin-bottom:14px}

.back-link{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:.85rem;margin:18px 0;cursor:pointer;background:none;border:none}

.detail{display:grid;grid-template-columns:1.4fr 1fr;gap:26px}

.detail-main{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:#0e1219}
.detail-main img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.detail-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}

.specs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}

.spec-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.88rem}

.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.field{margin-bottom:14px}

.input,select.input,textarea.input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 14px;font-family:inherit;font-size:.92rem;transition:.25s}
.input:focus{border-color:var(--accent);outline:none}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

.skel{background:linear-gradient(90deg,#141926 25%,#1c2333 50%,#141926 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r)}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty svg{width:64px;height:64px;color:var(--line);margin-bottom:14px}
.footer{border-top:1px solid var(--line);background:var(--card);padding:22px 0;margin-top:40px}
.footer-in{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.footer-engineer{display:flex;align-items:center;gap:12px}
.footer-engineer .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#8b0000);display:grid;place-items:center;color:#fff;font-weight:800}
.footer-engineer .info b{display:block;font-size:.92rem;color:var(--text)}
.footer-engineer .info small{font-size:.72rem;color:var(--muted)}
.footer small{color:var(--muted)}
.socials{display:flex;gap:10px}
.socials a{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:.25s}
.socials a:hover{color:var(--accent);border-color:var(--accent)}
.socials svg{width:18px;height:18px}
.lightbox{position:fixed;inset:0;z-index:150;background:rgba(5,7,10,.96);display:flex;align-items:center;justify-content:center;touch-action:none}
.lightbox img{max-width:92vw;max-height:86vh;user-select:none;cursor:grab;transition:transform .12s ease-out;border-radius:8px}
.lb-btn{position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,31,.8);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:3}
.lb-btn svg{width:20px;height:20px}
.lb-close{top:16px;inset-inline-end:16px}.lb-prev{top:50%;transform:translateY(-50%);inset-inline-end:14px}.lb-next{top:50%;transform:translateY(-50%);inset-inline-start:14px}
.lb-zoom{bottom:16px;inset-inline-start:16px;display:flex;gap:8px}
.lb-count{position:absolute;top:22px;inset-inline-start:20px;color:var(--muted);font-size:.85rem}
#botIcon{position:fixed;z-index:120;width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;cursor:grab;touch-action:none;transition:box-shadow .25s}
#botIcon:active{cursor:grabbing}

#botBubble{position:fixed;z-index:119;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-size:.8rem;color:var(--text);box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:.3s;pointer-events:none;white-space:nowrap}
#botBubble.show{opacity:1;transform:translateY(0)}
#botWin{position:fixed;z-index:130;width:min(370px,calc(100vw - 20px));height:min(560px,72vh);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.bot-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.bot-head .av{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--accent) 15%,transparent);display:grid;place-items:center;color:var(--accent)}
.bot-head h4{margin:0;font-size:.95rem}
.bot-head small{color:var(--muted);font-size:.7rem}
.bot-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bot-msg{max-width:85%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:.86rem;white-space:pre-wrap}
.bot-msg.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 18%,var(--bg));border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.bot-chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px}
.palette-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.25s}
.palette-card:hover{border-color:var(--accent)}
.palette-card h5{margin:0 0 8px;font-size:.88rem}
.swatches{display:flex;gap:6px;margin-bottom:8px}
.swatches i{width:26px;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.12)}

.admin{display:grid;grid-template-columns:230px 1fr;gap:20px;padding:24px 0;min-height:80vh}

.admin-side{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;height:fit-content;position:sticky;top:80px}

.admin-main{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}

.badge.pub{color:#7ee2a8;border-color:#1d4a33}.badge.draft{color:#ffd47e;border-color:#5b4a1d}

async function compress(dataUrl,{maxDim=1600,quality=0.82,watermark=false}={}){
  const img=await drawImg(dataUrl);

  const sc=Math.min(1,maxDim/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,w,h);

}
async function compressToFit(file,{maxDim=1600,quality=0.82,watermark=false}={}){
  const src=await loadFile(file);
  let isPano=false;
  if(maxDim>=1600){const pr=await drawImg(src);const ar=pr.width/pr.height;if(ar>1.9&&ar<2.1&&pr.width>=2000){isPano=true;maxDim=3000;watermark=false;}}

  for(let i=0;i<6&&out.size>900*1024;i++){q=Math.max(0.45,q-0.1);dim=Math.round(dim*0.85);out=await compress(src,{maxDim:dim,quality:q,watermark});}

}

const _hex=(r,g,b)=>"#"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
function colorName(hex){
  const n=parseInt(hex.slice(1),16),r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  const s=d===0?0:d/(1-Math.abs(2*l-1));
  let h=0;
  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;}
  if(l>0.93)return "أبيض";
  if(l<0.13)return "أسود";
  if(s<0.12)return l>0.8?"أبيض":"رمادي";
  if(h<15||h>=345)return l<0.32?"عنابي":(l>0.8?"وردي":"أحمر");
  if(h<45)return l>0.65?"بيج":(l<0.5?"بني":(s>0.7?"برتقالي":"بيج"));
  if(h<68)return s<0.45?(l>0.55?"بيج":"بني"):(l<0.55?"ذهبي":"أصفر");
  if(h<165)return "أخضر";
  if(h<200)return "فيروزي";
  if(h<258)return "أزرق";
  if(h<292)return "بنفسجي";
  return l<0.32?"عنابي":"وردي";
}
const colorNames=cols=>[...new Set((cols||[]).map(colorName))];
async function extractColors(src,n=5){
  try{
    const img=await drawImg(src);
    const W=56,H=Math.max(8,Math.round(W*img.height/img.width));
    const c=document.createElement("canvas"); c.width=W; c.height=H;
    const ctx=c.getContext("2d",{willReadFrequently:true}); ctx.drawImage(img,0,0,W,H);
    const px=ctx.getImageData(0,0,W,H).data, bins=new Map();
    for(let i=0;i<px.length;i+=4){
      if(px[i+3]<128)continue;
      const r=px[i],g=px[i+1],b=px[i+2],k=((r>>4)<<8)|((g>>4)<<4)|(b>>4);
      let o=bins.get(k); if(!o){o={n:0,r:0,g:0,b:0};bins.set(k,o);}
      o.n++;o.r+=r;o.g+=g;o.b+=b;
    }
    const arr=[...bins.values()].map(o=>{
      const r=o.r/o.n,g=o.g/o.n,b=o.b/o.n,mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx?(mx-mn)/mx:0;
      return {r,g,b,w:o.n*(1+sat*1.2)};
    }).sort((a,b)=>b.w-a.w);
    const out=[];
    for(const o of arr){
      if(out.every(p=>Math.hypot(p.r-o.r,p.g-o.g,p.b-o.b)>58)){out.push(o);if(out.length>=n)break;}
    }
    return out.map(o=>_hex(o.r,o.g,o.b));
  }catch{return [];}
}

  b.style.position="fixed"; b.style.top=`-${_lockY}px`; b.style.left="0"; b.style.right="0"; b.style.width="100%";

/* ================= عارض الصور (مُصلح: الأسهم والإغلاق يعملان) ================= */
let lbImgs=[],lbIdx=0,lbScale=1,lbTx=0,lbTy=0,lbOpen=false,lbDX=0; const lbPointers=new Map(); let lbPinch0=0,lbScale0=1;
function lbKey(e){
  if(e.key==="Escape")closeLightbox();
  else if(e.key==="ArrowRight")lbStep(-1);
  else if(e.key==="ArrowLeft")lbStep(1);
}
function closeLightbox(){
  const lb=$("#lightbox"); if(!lb)return;
  lb.setAttribute("hidden",""); lb.style.display="none"; lb.innerHTML="";
  lb.onpointerdown=lb.onpointermove=lb.onpointerup=lb.onpointercancel=lb.onwheel=lb.onclick=null;
  document.removeEventListener("keydown",lbKey); lbPointers.clear();
  if(lbOpen){lbOpen=false;unlockScroll();}
}
function openLightbox(list,start=0){
  if(!list||!list.length)return;
  lbImgs=list; lbIdx=Math.max(0,Math.min(start,list.length-1)); lbScale=1; lbTx=lbTy=0; lbDX=0;
  const lb=$("#lightbox");
  lb.removeAttribute("hidden"); lb.style.display="flex";
  if(!lbOpen){lbOpen=true;lockScroll();}
  const multi=list.length>1;
  lb.innerHTML=`<button class="lb-btn lb-close" aria-label="إغلاق">${icon("close")}</button>
    ${multi?`<button class="lb-btn lb-prev" aria-label="السابق">${icon("chevR")}</button>
    <button class="lb-btn lb-next" aria-label="التالي">${icon("chevL")}</button>`:""}
    <div class="lb-zoom"><button class="lb-btn" id="lbIn" aria-label="تكبير">${icon("zoomin")}</button><button class="lb-btn" id="lbOut" aria-label="تصغير">${icon("zoomout")}</button></div>
    <span class="lb-count"></span><img alt="صورة مكبرة" draggable="false">`;
  lb.querySelector(".lb-close").onclick=closeLightbox;
  if(multi){lb.querySelector(".lb-prev").onclick=()=>lbStep(-1);lb.querySelector(".lb-next").onclick=()=>lbStep(1);}
  lb.querySelector("#lbIn").onclick=()=>lbSetScale(lbScale*1.3);
  lb.querySelector("#lbOut").onclick=()=>lbSetScale(lbScale/1.3);
  const im=lb.querySelector("img");
  im.onload=()=>lbApply();
  im.onerror=()=>{im.onerror=null;im.src=fallbackScene();};
  im.ondblclick=()=>lbSetScale(lbScale>1?1:2.5);
  document.removeEventListener("keydown",lbKey); document.addEventListener("keydown",lbKey);
  const dist=()=>{const [a,b]=[...lbPointers.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])||1;};
  /* ✅ السبب القديم: setPointerCapture على الخلفية كان يبتلع نقرات الأزرار. الآن نتجاهل الأزرار تماماً */
  lb.onpointerdown=e=>{
    if(e.target.closest(".lb-btn"))return;
    lbPointers.set(e.pointerId,[e.clientX,e.clientY]); lbDX=0;
    if(lbPointers.size===2){lbPinch0=dist();lbScale0=lbScale;}
  };
  lb.onpointermove=e=>{
    if(!lbPointers.has(e.pointerId))return;
    const prev=lbPointers.get(e.pointerId); lbPointers.set(e.pointerId,[e.clientX,e.clientY]);
    if(lbPointers.size===2)lbSetScale(lbScale0*(dist()/lbPinch0));
    else if(lbScale>1){lbTx+=e.clientX-prev[0];lbTy+=e.clientY-prev[1];lbApply();}
    else lbDX+=e.clientX-prev[0];
  };
  lb.onpointerup=lb.onpointercancel=e=>{
    if(!lbPointers.has(e.pointerId))return;
    const swipe=multi&&lbPointers.size===1&&lbScale===1&&Math.abs(lbDX)>60, dx=lbDX;
    lbPointers.delete(e.pointerId); lbDX=0;
    if(swipe)lbStep(dx>0?-1:1);
  };
  lb.onclick=e=>{if(e.target===lb)closeLightbox();};
  lb.onwheel=e=>{e.preventDefault();lbSetScale(lbScale*(e.deltaY<0?1.15:.87));};
  lbShow();
}
function lbSetScale(s){lbScale=Math.min(5,Math.max(1,s));if(lbScale===1)lbTx=lbTy=0;lbApply();}
function lbApply(){const img=$("#lightbox img");if(img)img.style.transform=`translate(${lbTx}px,${lbTy}px) scale(${lbScale})`;}
function lbShow(){const lb=$("#lightbox");lb.querySelector("img").src=lbImgs[lbIdx];lb.querySelector(".lb-count").textContent=`${lbIdx+1} / ${lbImgs.length}`;lbScale=1;lbTx=lbTy=0;lbApply();}
function lbStep(d){if(lbImgs.length<2)return;lbIdx=(lbIdx+d+lbImgs.length)%lbImgs.length;lbShow();}

  const st={mode:null,idx:Math.max(0,Math.min(start,images.length-1)),auto:true};

  const paintBtns=()=>{

        if(o.geometry)o.geometry.dispose();
        const ms=o.material?(Array.isArray(o.material)?o.material:[o.material]):[];
        ms.forEach(m=>{for(const k in m){const t=m[k];if(t&&t.isTexture)t.dispose();}m.dispose();});

    bindPanoControls();
  }
  async function setupModel(){
    const my=++tok; disposeScene(); setLoad("جاري تحميل النموذج ثلاثي الأبعاد...");
    let buf=null; try{buf=await loadModel?.();}catch(err){console.error(err);}
    if(my!==tok||_v3!==v)return; if(!buf){setLoad("لا يوجد نموذج مرفوع لهذا التصميم");return;}
    let gltf; try{gltf=await new Promise((res,rej)=>new T.GLTFLoader().parse(buf,"",res,rej));}catch(err){console.error(err);setLoad("تعذر قراءة النموذج — يجب أن يكون ملف GLB صالحاً");return;}

}

/* ================= توليد أيقونات التواصل المباشر ================= */
function socialIconsHTML(compact=false){
  const l=settings.links||{}, c=settings.contact||{};
  const items=[];
  if(c.whatsappNumber||l.whatsapp){
    const num=(c.whatsappNumber||"").replace(/\D/g,"");
    const url=num?`https://wa.me/${num}`:l.whatsapp;
    if(url)items.push(`<a class="wa" href="${esc(url)}" target="_blank" rel="noopener" aria-label="واتساب">${icon("wa")}</a>`);
  }
  if(l.twitter)items.push(`<a class="x" href="${esc(l.twitter)}" target="_blank" rel="noopener" aria-label="تويتر">${icon("x")}</a>`);
  if(l.instagram)items.push(`<a class="ig" href="${esc(l.instagram)}" target="_blank" rel="noopener" aria-label="إنستغرام">${icon("ig")}</a>`);
  if(l.facebook)items.push(`<a class="fb" href="${esc(l.facebook)}" target="_blank" rel="noopener" aria-label="فيسبوك">${icon("fb")}</a>`);
  if(c.email)items.push(`<a class="mail" href="mailto:${esc(c.email)}" aria-label="البريد الإلكتروني">${icon("mail")}</a>`);
  return items.join("");
}

function renderChips(){
  $("#chips").innerHTML=`<button class="chip ${!pState.cat?"active":""}" data-c="">الكل</button>`+store.categories.map(c=>`<button class="chip ${pState.cat===c.slug?"active":""}" data-c="${esc(c.slug)}">${esc(c.name)}</button>`).join("");
  $("#chips").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;pState.cat=b.dataset.c;renderChips();pReset();};

async function pReset(){pState.items=[];pState.page=0;pState.done=false;$("#pGrid").innerHTML=skeletonGrid(appConfig.pageSize);await fetchPage();}
const catIdBySlug=slug=>store.categories.find(c=>c.slug===slug)?.id||"";
async function fetchPage(){
  if(pState.loading||pState.done)return; pState.loading=true;
  const all=await getAllDesigns();
  let pool=all.filter(dd=>dd.status==="published");
  if(pState.cat) pool=pool.filter(dd=>dd.categoryId===catIdBySlug(pState.cat));
  if(pState.color) pool=pool.filter(dd=>(dd.colorTags||[]).includes(pState.color));
  if(pState.q){
    const q=pState.q.toLowerCase();
    pool=pool.filter(dd=>(dd.title||"").toLowerCase().includes(q)||(dd.tags||[]).some(t=>(t||"").toLowerCase().includes(q))||store.catName(dd.categoryId).toLowerCase().includes(q));
  }
  const orderF=pState.sort==="likes"?"likesCount":"createdAt";
  pool.sort((a,b)=>(b[orderF]||0)-(a[orderF]||0));
  const start=pState.page*appConfig.pageSize, end=start+appConfig.pageSize;
  const slice=pool.slice(start,end);
  pState.items.push(...slice);
  if(slice.length<appConfig.pageSize||end>=pool.length) pState.done=true;
  pState.page++;
  paintGrid(); pState.loading=false;
}
function paintGrid(){
  const g=$("#pGrid");
  g.innerHTML=pState.items.length?`<div class="grid">${pState.items.map(dd=>designCard(dd,store.catName(dd.categoryId))).join("")}</div>`:emptyState("لا توجد نتائج مطابقة");
  bindCards(g); $("#more").hidden=pState.done;
}

const GREET=["السلام عليكم","اسمي «تصميم»","أهلاً بك في بيتك للتصميم","اختر نوع التصميم الذي تبحث عنه وسأساعدك في الاختيار","ماذا تريد أن تصمّم؟"];
const SHORTS=["السلام عليكم","أنا هنا","معك معك","تفضل"];
let botOpen=false, botState=null, bubbleTimer=null;
const _palCache={};
function initBot(){
  const root=$("#botRoot");
  root.innerHTML=`<div id="botBubble"></div><button id="botIcon" aria-label="المساعد تصميم">${icon("house")}${localStorage.getItem("ap_bot_seen")?"":`<i class="dot"></i>`}</button>`;
  const ic=$("#botIcon");
  placeIcon(ic); makeDraggable(ic);
  ic.addEventListener("click",()=>{if(ic.dataset.dragged==="1"){ic.dataset.dragged="0";return;}botToggle(true);});
  window.addEventListener("resize",()=>placeIcon(ic));
  scheduleBubble(true); setTimeout(prefetchPalettes,800);
  store.onChange(()=>{if(botOpen&&botState?.step==="cats")renderCats();});
}
function placeIcon(ic){
  let p;try{p=JSON.parse(localStorage.getItem("ap_bot_pos"));}catch{}
  const m=10,S=58;
  let x=p?.x??m, y=p?.y??(innerHeight-S-m-(innerWidth<=820?62:0));
  x=Math.min(Math.max(m,x),innerWidth-S-m); y=Math.min(Math.max(m,y),innerHeight-S-m);
  ic.style.left=x+"px"; ic.style.top=y+"px";
}
function makeDraggable(ic){
  let sx,sy,ox,oy,moved;
  ic.addEventListener("pointerdown",e=>{moved=false;sx=e.clientX;sy=e.clientY;ox=ic.offsetLeft;oy=ic.offsetTop;ic.setPointerCapture(e.pointerId);
    const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(!moved)return;const m=10,S=58;
      ic.style.left=Math.min(Math.max(m,ox+dx),innerWidth-S-m)+"px";
      ic.style.top=Math.min(Math.max(m,oy+dy),innerHeight-S-m)+"px";};
    const up=()=>{ic.removeEventListener("pointermove",mv);ic.removeEventListener("pointerup",up);
      if(moved){ic.dataset.dragged="1";localStorage.setItem("ap_bot_pos",JSON.stringify({x:ic.offsetLeft,y:ic.offsetTop}));}};
    ic.addEventListener("pointermove",mv); ic.addEventListener("pointerup",up);});
}
function botToggle(toOpen){
  botOpen=toOpen;
  if(botOpen){localStorage.setItem("ap_bot_seen","1");$("#botIcon .dot")?.remove();ensureWin();bumpStat("botOpens");botState?botResume():botGreet();}
  else $("#botWin")?.remove();
}
function ensureWin(){
  if($("#botWin"))return;
  const ic=$("#botIcon");
  const w=document.createElement("div"); w.id="botWin";
  w.style.left=Math.max(10,Math.min(ic.offsetLeft-160,innerWidth-380))+"px";
  w.style.top=Math.max(10,ic.offsetTop-570)+"px";
  w.innerHTML=`<div class="bot-head"><span class="av">${icon("house")}</span><div style="flex:1"><h4>تصميم</h4><small>مساعد افتراضي</small></div><button class="icon-btn" id="botClose" aria-label="إغلاق">${icon("close")}</button></div><div class="bot-body" id="botBody"></div><div class="bot-chips" id="botChips"></div>`;
  $("#botRoot").appendChild(w);
  $("#botClose").onclick=async()=>{$("#botClose").onclick=null;await botSay("السلام عليكم.");await wait(650);botToggle(false);};
}
async function botSay(text,me=false){
  const body=$("#botBody"); if(!body)return;
  const m=document.createElement("div"); m.className="bot-msg"+(me?" me":""); body.appendChild(m); body.scrollTop=body.scrollHeight;
  if(me||reducedMotion()){m.textContent=text;body.scrollTop=body.scrollHeight;return;}
  for(let i=0;i<text.length;i+=4){m.textContent=text.slice(0,i+4);body.scrollTop=body.scrollHeight;await wait(14);}
}
async function botGreet(){
  botState={step:"cats"};
  for(const g of GREET){await botSay(g);await wait(40);}
  renderCats();
}
function botResume(){
  if(botState.step==="cats")renderCats();
  else if(botState.step==="colors"){botSay("ما هي ألوانك المفضلة؟");renderPalettes();}
  else if(botState.step==="done")renderDone();
}
function renderCats(){
  const c=$("#botChips"); if(!c)return;
  c.innerHTML=store.categories.map(x=>`<button class="chip" data-slug="${esc(x.slug)}" data-id="${x.id}">${esc(x.name)}</button>`).join("")||`<span style="color:var(--muted);font-size:.8rem">لا توجد تصنيفات بعد</span>`;
  c.onclick=async e=>{
    const b=e.target.closest("[data-slug]"); if(!b)return;
    botState={step:"colors",cat:{slug:b.dataset.slug,id:b.dataset.id,name:b.textContent}};
    await botSay(b.textContent,true);
    bumpStat("cat_"+b.dataset.slug);
    botToggle(false);
    nav(`/portfolio?cat=${encodeURIComponent(b.dataset.slug)}`);
    setTimeout(()=>showBubble("ما هي ألوانك المفضلة؟ اضغط عليّ"),2500);
  };
}
const reducedMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function designPalettes(cid){
  return getAllDesigns().then(all=>all
    .filter(d=>d.status==="published"&&d.categoryId===cid&&Array.isArray(d.colors)&&d.colors.length>=3)
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,6)
    .map(d=>({name:d.title,colors:d.colors.slice(0,6),tiles:d.materials||"",furniture:"",curtains:"",carpet:"",tags:d.colorTags||colorNames(d.colors),designId:d.id,auto:true}))
  ).catch(()=>[]);
}
async function prefetchPalettes(){
  try{const {db,collection,getDocs}=await fb();const s=await getDocs(collection(db,"palettes"));
    s.docs.forEach(x=>{const it=x.data()?.items;if(it&&it.length)_palCache[x.id]=it;});}catch{}
}
async function renderPalettes(){
  botState.step="colors";
  const cid=botState.cat.id;
  let base=_palCache[cid];
  if(!base){
    try{const {db,doc,getDoc}=await fb();const s=await getDoc(doc(db,"palettes",cid));base=s.data()?.items;}catch{}
    if(!base||!base.length)base=DEFAULT_PALETTES[botState.cat.slug]||DEFAULT_PALETTES.living;
    _palCache[cid]=base;
  }
  const autos=await designPalettes(cid);
  const items=[...autos,...base];
  $("#botChips").innerHTML="";
  $("#palList")?.remove();
  const body=$("#botBody"); if(!body)return;
  const line=(l,v)=>v?`<p><b>${l}:</b> ${esc(v)}</p>`:"";
  body.insertAdjacentHTML("beforeend",`<div id="palList" style="display:flex;flex-direction:column;gap:8px">${items.map((p,i)=>`
    <div class="palette-card" data-i="${i}"><h5>${p.auto?`<span class="badge pub" style="margin-inline-end:6px">من أعمالنا</span>`:""}${esc(p.name)}</h5>
      <div class="swatches">${(p.colors||[]).slice(0,6).map(h=>`<i style="background:${esc(h)}" title="${esc(h)}"></i>`).join("")}</div>
      ${line("الأرضيات",p.tiles)}${line("الأثاث",p.furniture)}${line("الستائر",p.curtains)}${line("السجاد",p.carpet)}
      ${p.auto&&(p.tags||[]).length?line("الألوان",(p.tags||[]).slice(0,4).join("، ")):""}
    </div>`).join("")}</div>`);
  body.scrollTop=body.scrollHeight;
  $("#palList").onclick=async e=>{
    const card=e.target.closest("[data-i]"); if(!card)return;
    botState.palette=items[+card.dataset.i]; botState.step="done";
    await botSay(botState.palette.name,true);
    await botSay("اختيار رائع! جهزت لك خيارات المتابعة:");
    renderDone();
  };
}
function renderDone(){
  const c=$("#botChips"); if(!c)return;
  const p=botState.palette||{}; const tag=(p.tags||[])[0]||"";
  const waNum=settings.contact?.whatsappNumber||"";
  const waMsg=encodeURIComponent(`السلام عليكم، أعجبني تصميم (${botState.cat?.name||""}) بباقة ألوان (${p.name||""}) وأرغب بالاستفسار.`);
  c.innerHTML=`${p.designId?`<button class="chip active" id="bOpen">افتح هذا التصميم</button>`:""}
    <button class="chip ${p.designId?"":"active"}" id="bView">شاهد التصاميم المطابقة</button>
    ${waNum?`<a class="chip" target="_blank" href="https://wa.me/${waNum}?text=${waMsg}">${icon("wa")} تواصل واتساب</a>`:""}
    <button class="chip" id="bRestart">ابدأ من جديد</button>`;
  $("#bOpen")&&($("#bOpen").onclick=()=>{botToggle(false);nav(`/design/${p.designId}`);});
  $("#bView").onclick=()=>{botToggle(false);nav(`/portfolio?cat=${encodeURIComponent(botState.cat.slug)}${tag?`&color=${encodeURIComponent(tag)}`:""}`);};
  $("#bRestart").onclick=()=>{botState=null;$("#botBody").innerHTML="";$("#botChips").innerHTML="";botGreet();};
}
function showBubble(txt,ms=3200){
  const b=$("#botBubble"),ic=$("#botIcon"); if(!b||!ic||botOpen)return;
  b.textContent=txt;
  const right=ic.offsetLeft>innerWidth/2;
  if(right){b.style.left="auto";b.style.right=(innerWidth-ic.offsetLeft+8)+"px";}
  else{b.style.right="auto";b.style.left=(ic.offsetLeft+ic.offsetWidth+8)+"px";}
  b.style.top=(ic.offsetTop+ic.offsetHeight/2-17)+"px";
  b.classList.add("show"); clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove("show"),ms);
}
function scheduleBubble(first){
  clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(()=>{
    if(currentPath()==="/"&&!botOpen&&!document.hidden)showBubble(SHORTS[Math.floor(Math.random()*SHORTS.length)]);
    scheduleBubble(false);
  },first?2200:9000+Math.random()*6000);
}

async function bumpStat(field){
  try{const {db,doc,setDoc,increment}=await fb();
    await setDoc(doc(db,"stats",new Date().toISOString().slice(0,10)),{[field]:increment(1)},{merge:true});
  }catch{}
}

let aSec="designs";
let _adminUnsub=null,_justLogged=false;
function stopAdminWatch(){if(_adminUnsub){try{_adminUnsub();}catch{}_adminUnsub=null;}}
const authMsg=e=>{
  const c=e?.code||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return "البريد أو كلمة المرور غير صحيحة";
  if(c==="auth/too-many-requests")return "محاولات كثيرة — انتظر قليلاً ثم أعد المحاولة";
  if(c==="auth/network-request-failed")return "تعذر الاتصال بالإنترنت";
  if(c==="auth/unauthorized-domain")return "النطاق غير مصرح به: أضفه في Firebase ← Authentication ← Settings ← Authorized domains";
  if(c==="auth/operation-not-allowed")return "فعّل تسجيل الدخول بالبريد وكلمة المرور في Firebase ← Authentication ← Sign-in method";
  return "تعذر تسجيل الدخول"+(c?` (${c})`:"");
};
async function renderAdmin(root){
  const F=await fb(); stopAdminWatch();
  _adminUnsub=F.onAuthStateChanged(F.auth,async u=>{
    if(currentPath()!==(settings.adminPath||"/admin-panel"))return;
    /* الزائر العادي (مجهول) لا يُعتبر مسجلاً: تظهر له شاشة الدخول دائماً */
    if(!u||u.isAnonymous){if(!$("#lf"))loginView(root);return;}
    const ok=await isAdmin(u.uid);
    if(!ok){
      sessionStorage.removeItem("ap_unlocked"); _justLogged=false;
      toast("هذا الحساب ليس مديراً للموقع","err");
      await F.signOut(F.auth); return;
    }
    const remembered=localStorage.getItem("ap_remember")===u.uid;
    if(_justLogged||remembered||sessionStorage.getItem("ap_unlocked")===u.uid){
      _justLogged=false; sessionStorage.setItem("ap_unlocked",u.uid); return adminShell(root);
    }
    unlockView(root,u);
  });
}
async function isAdmin(uidv){
  if(sessionStorage.getItem("ap_isadmin")===uidv)return true;
  const {db,doc,getDoc}=await fb();
  try{const s=await getDoc(doc(db,"admins",uidv));
    if(s.exists()){sessionStorage.setItem("ap_isadmin",uidv);invalidateDesignsCache();return true;}
  }catch{}

    if(pending.length){

      for(let i=0;i<pending.length;i++){

      if(newCoverThumb)thumb=newCoverThumb;
      else{const u=await Base64FirestoreAdapter.getImageUrl(id,coverKey);if(u)thumb=(await thumbOf(u)).data;}
    }

    else if(modelRemove){await deleteModel(id);data.hasModel=false;}
    else data.hasModel=hadModel;
    const coverChanged=(coverKey||null)!==(d.coverImageId||null);
    let cols=newCoverCols&&newCoverCols.length?newCoverCols:((thumb&&(coverChanged||!(d.colors&&d.colors.length)))?await extractColors(thumb):(d.colors||[]));

    data.thumbnail=thumb; data.coverImageId=coverKey||null; data.imagesCount=existing.length+pending.length;

    invalidateDesignsCache();
    toast("تم الحفظ بنجاح"); secDesigns(m);
  };

function makeSortable(tbody,onDone){
  let dragId=null;
  tbody.addEventListener("dragstart",e=>{dragId=e.target.closest("tr")?.dataset.id;e.target.closest("tr").style.opacity=.5;});
  tbody.addEventListener("dragover",e=>{e.preventDefault();const tr=e.target.closest("tr");if(!tr||tr.dataset.id===dragId)return;tbody.querySelectorAll("tr").forEach(x=>x.classList.remove("dragover"));tr.classList.add("dragover");const rows=[...tbody.children];const from=rows.findIndex(x=>x.dataset.id===dragId),to=rows.findIndex(x=>x===tr);if(from<to)tr.after(rows[from]);else tr.before(rows[from]);});

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 667" width="1000" height="667" preserveAspectRatio="xMidYMid slice">${defs}${bg}${body}<rect width="1000" height="667" fill="url(#vg)"/></svg>`;
}
function sceneURI(slug,pal,i=0){
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(sceneSVG(slug,pal,i)).replace(/'/g,"%27").replace(/\(/g,"%28").replace(/\)/g,"%29");
}

function fallbackScene(){

  return "data:image/svg+xml;utf8,"+encodeURIComponent(s);

const SEED_META={living:"غرفة جلوس",bedroom:"غرفة نوم",bathroom:"حمام",salon:"صالون",kitchen:"مطبخ",kids:"غرفة أطفال",exterior:"واجهة فيلا"};
const CITIES=["الرياض، السعودية","جدة، السعودية","دبي، الإمارات","الدوحة، قطر","الكويت، الكويت","مسقط، عُمان","المنامة، البحرين","أبوظبي، الإمارات","عمّان، الأردن","الخبر، السعودية"];
const isDemoDoc=d=>d.demo===true||/images\.unsplash\.com/.test(d.thumbnail||"");
async function clearAllDesigns(prog){
  /* يحذف التصاميم التجريبية فقط — أعمالك الحقيقية لا تُمسّ */
  const F=await fb();
  const ds=await F.getDocs(F.collection(F.db,"designs"));
  const list=ds.docs.filter(x=>isDemoDoc(x.data()));
  let i=0;
  for(const d of list){
    const ims=await F.getDocs(F.collection(F.db,"designs",d.id,"images"));
    for(const im of ims.docs)await F.deleteDoc(im.ref);
    await deleteModel(d.id);
    await F.deleteDoc(d.ref);
    i++; prog?.(i,list.length);
  }
  invalidateDesignsCache();
  return list.length;
}
async function seedAll(progress=()=>{}){
  const F=await fb(); const {db,collection,addDoc,setDoc,doc,getDocs}=F;
  progress("حذف التصاميم التجريبية القديمة (أعمالك الحقيقية آمنة)...");
  await clearAllDesigns();
  progress("التصنيفات والباقات...");
  const catIds={};
  const SEED_CATS=[["غرف جلوس","living"],["غرف نوم","bedroom"],["حمامات","bathroom"],["صالونات","salon"],["مطابخ","kitchen"],["غرف أطفال","kids"],["تصاميم خارجية","exterior"]];
  const ex=await getDocs(collection(db,"categories"));
  for(let i=0;i<SEED_CATS.length;i++){
    const [name,slug]=SEED_CATS[i];
    const found=ex.docs.find(dd=>dd.data().slug===slug);
    catIds[slug]=found?found.id:(await addDoc(collection(db,"categories"),{name,slug,order:i,createdAt:Date.now()})).id;
    await setDoc(doc(db,"palettes",catIds[slug]),{items:DEFAULT_PALETTES[slug]||DEFAULT_PALETTES.living},{merge:true});
  }
  let n=0;
  for(const slug of Object.keys(SEED_META)){
    const pals=DEFAULT_PALETTES[slug];
    for(let i=0;i<10;i++){
      const p=pals[i]; n++;
      progress(`إنشاء التصاميم ${n}/70 ...`);
      const typeName=SEED_META[slug];
      const cover=sceneURI(slug,p.colors,i), alt=sceneURI(slug,p.colors,i+11);
      const dRef=await addDoc(collection(db,"designs"),{
        title:`${typeName} — باقة ${p.name}`, categoryId:catIds[slug], demo:true,
        description:`تصميم ${typeName} بأسلوب «${p.name}»: ${p.furniture}، أرضيات ${p.tiles}، مع ${p.curtains} و${p.carpet}. (عمل تجريبي — احذفه من النسخ الاحتياطي ← حذف البيانات التجريبية)`,
        specs:[{name:"الإضاءة",value:i%2?"نهارية + مخفية":"مسائية + ثريات"},{name:"النمط",value:(p.tags||[])[1]||"عصري"},{name:"الأرضيات",value:p.tiles}],
        year:String(2023+(i%3)), area:`${90+((i*37)%260)} م²`, materials:p.tiles,
        location:CITIES[i%CITIES.length], software:"3D Max",
        tags:[typeName,p.name,slug], colorTags:p.tags||[], colors:p.colors,
        thumbnail:cover, coverImageId:"i1", imagesCount:2,
        likesCount:4+((i*7)%40), viewsCount:30+((i*53)%400),
        featured:i<2, status:"published", order:n, createdAt:Date.now()-n*3600000, updatedAt:Date.now()
      });
      await setDoc(doc(db,"designs",dRef.id,"images","i1"),{imageUrl:cover,thumb:cover,order:0,width:1000,height:667,size:0,chunked:false});
      await setDoc(doc(db,"designs",dRef.id,"images","i2"),{imageUrl:alt,thumb:alt,order:1,width:1000,height:667,size:0,chunked:false});
    }
  }
  progress("الإعدادات النهائية...");
  await setDoc(doc(db,"settings","site"),{heroImage:"",colsDesktop:3,colsMobile:2},{merge:true});
  progress("تم!");
}
