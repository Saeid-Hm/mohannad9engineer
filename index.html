<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معرض التصاميم المعمارية | م. مهند</title>
<meta name="description" content="معرض تصاميم معمارية وديكورات داخلية وخارجية منفذة باحترافية">
<meta property="og:title" content="معرض التصاميم المعمارية">
<meta property="og:description" content="تصاميم معمارية ثلاثية الأبعاد خالية من ذوات الأرواح">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B0E14">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontLink" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E14;--card:#12161F;--line:#1E2430;--accent:#E10600;--text:#F5F5F5;--muted:#9AA3B2;--r:12px;--cols-d:3;--cols-m:2;--font:'Cairo';--shadow:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font),system-ui,sans-serif;font-size:1rem;line-height:1.7;overflow-x:hidden}
body.modal-open{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.35;margin:0 0 .5em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.container{width:min(1200px,92%);margin-inline:auto}
.only-mobile{display:none!important}
@media(max-width:820px){.only-mobile{display:inline-flex!important}.no-mobile{display:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.geo{position:relative;overflow:hidden}
.geo::before,.geo::after{content:"";position:absolute;width:230px;height:230px;pointer-events:none;opacity:.55;
 background:
  linear-gradient(135deg,transparent 48.5%,var(--accent) 49%,var(--accent) 51%,transparent 51.5%) 0 0/100% 100% no-repeat,
  linear-gradient(135deg,transparent 48.5%,var(--accent) 49%,var(--accent) 51%,transparent 51.5%) 46px 46px/100% 100% no-repeat,
  linear-gradient(135deg,transparent 48.5%,var(--accent) 49%,var(--accent) 51%,transparent 51.5%) 92px 92px/100% 100% no-repeat;}
.geo::before{inset-inline-end:-70px;top:-70px}
.geo::after{inset-inline-start:-70px;bottom:-70px;transform:rotate(180deg)}
#splash{position:fixed;inset:0;background:var(--bg);z-index:200;display:grid;place-items:center;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{font-size:56px;font-weight:900;color:var(--accent);letter-spacing:2px;animation:pop .8s ease}
.splash-lines{position:absolute;width:220px;opacity:.7}
.splash-lines path{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{from{transform:scale(.6);opacity:0}}
.header{position:sticky;top:0;z-index:60;background:rgba(11,14,20,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.header-in{display:flex;align-items:center;gap:18px;height:64px}
.logo{font-weight:900;font-size:26px;color:var(--accent);cursor:pointer;user-select:none;letter-spacing:1px}
.topnav{display:flex;gap:6px;margin-inline-start:auto}
.topnav a{padding:8px 14px;border-radius:10px;color:var(--muted);font-size:.95rem;font-weight:500;transition:.25s}
.topnav a:hover,.topnav a.active{color:var(--text);background:var(--card)}
.topnav a.active{color:var(--accent)}
@media(max-width:820px){.topnav{display:none}}
.header-actions{display:flex;gap:8px;margin-inline-start:auto;align-items:center}
.topnav+.header-actions{margin-inline-start:0}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:.25s;color:var(--muted)}
.icon-btn:hover{color:var(--text);border-color:var(--accent)}
.icon-btn svg{width:20px;height:20px}
.engineer-badge{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 6px;cursor:default}
.engineer-badge .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#8b0000);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85rem}
.engineer-badge .info{display:flex;flex-direction:column;line-height:1.2}
.engineer-badge .info b{font-size:.82rem;color:var(--text)}
.engineer-badge .info small{font-size:.65rem;color:var(--muted)}
@media(max-width:980px){.engineer-badge{display:none}}
.social-icons{display:flex;gap:6px;align-items:center}
.social-icons a{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted);transition:.25s}
.social-icons a:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
.social-icons a.wa:hover{color:#25D366;border-color:#25D366}
.social-icons a.ig:hover{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;border-color:transparent}
.social-icons a.x:hover{color:#000;background:#fff;border-color:#fff}
.social-icons a.fb:hover{color:#1877F2;border-color:#1877F2}
.social-icons a.mail:hover{color:#EA4335;border-color:#EA4335}
.social-icons svg{width:17px;height:17px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;opacity:0;transition:.3s}
.overlay.show{opacity:1}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(300px,84vw);background:var(--card);border-inline-end:1px solid var(--line);z-index:90;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;padding:18px}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer-nav{display:flex;flex-direction:column;gap:4px}
.drawer-nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;color:var(--muted);font-weight:500;transition:.25s}
.drawer-nav a svg{width:20px;height:20px}
.drawer-nav a:hover,.drawer-nav a.active{background:var(--bg);color:var(--text)}
.drawer-nav a.active{color:var(--accent)}
.drawer-engineer{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.drawer-engineer .av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#8b0000);display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.1rem;flex-shrink:0}
.drawer-engineer .info{flex:1}
.drawer-engineer .info b{display:block;font-size:.95rem;color:var(--text)}
.drawer-engineer .info small{font-size:.72rem;color:var(--muted)}
.drawer-social{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.drawer-social .social-icons{justify-content:center;gap:10px}
.drawer-social .social-icons a{width:42px;height:42px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:70;background:rgba(18,22,31,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:10px;color:var(--muted);font-size:.68rem;transition:.25s}
.bottomnav a svg{width:21px;height:21px}
.bottomnav a.active{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:12px 26px;font-weight:700;font-size:.95rem;cursor:pointer;transition:.25s;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.sm{padding:8px 18px;font-size:.85rem}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:#3a1113;color:#ff8a8a;border:1px solid #5b1a1d;box-shadow:none}
.btn svg{width:17px;height:17px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 18px;font-size:.85rem;cursor:pointer;transition:.25s;font-weight:500}
.chip:hover{color:var(--text)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.link-accent{color:var(--accent);font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:none;border:none}
.app{min-height:70vh;padding-bottom:70px}
@media(max-width:820px){.app{padding-bottom:120px}}
.section{padding:56px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.section-title{font-size:1.35rem;font-weight:800;position:relative;padding-inline-start:14px}
.section-title::before{content:"";position:absolute;inset-inline-start:0;top:15%;bottom:15%;width:4px;border-radius:4px;background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.28s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.grid{display:grid;grid-template-columns:repeat(var(--cols-m),1fr);gap:14px}
@media(min-width:821px){.grid{grid-template-columns:repeat(var(--cols-d),1fr);gap:18px}}
.dcard .thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:#0e1219}
.dcard .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.dcard:hover .thumb img{transform:scale(1.06)}
.dcard .meta{padding:10px 12px 14px}
.dcard .meta h3{font-size:.92rem;font-weight:700;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .meta span{font-size:.75rem;color:var(--muted)}
.like-btn{position:absolute;top:10px;inset-inline-start:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:none;background:rgba(11,14,20,.6);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer;transition:.25s}
.like-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
.like-btn.liked{color:var(--accent)}
.like-btn.liked svg{fill:currentColor}
.like-btn.pulse{animation:pulse .45s ease}
@keyframes pulse{40%{transform:scale(1.35)}}
.like-count{position:absolute;top:14px;inset-inline-start:50px;z-index:2;font-size:.72rem;color:#fff;background:rgba(11,14,20,.55);padding:2px 8px;border-radius:99px;backdrop-filter:blur(6px)}
.hero{position:relative;min-height:430px;display:flex;align-items:center;border-block:1px solid var(--line);overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to left,rgba(11,14,20,.55),rgba(11,14,20,.96) 65%)}
.hero-in{position:relative;z-index:2;padding:70px 0}
.hero h1{font-size:clamp(1.9rem,5vw,3.2rem);font-weight:900;margin-bottom:14px}
.hero h1 .accent{color:var(--accent)}
.hero p{color:var(--muted);max-width:460px;margin-bottom:26px}
.back-link{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:.85rem;margin:18px 0;cursor:pointer;background:none;border:none}
.back-link:hover{color:var(--accent)}
.detail{display:grid;grid-template-columns:1.4fr 1fr;gap:26px}
@media(max-width:900px){.detail{grid-template-columns:1fr}}
.detail-main{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:#0e1219;position:relative}
.detail-main img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.detail-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.detail-thumbs img{aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.25s}
.detail-thumbs img.sel{border-color:var(--accent)}
.specs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.specs h1{font-size:1.5rem;font-weight:800}
.spec-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.spec-row b{color:var(--muted);font-weight:500;min-width:90px;display:flex;align-items:center;gap:8px}
.spec-row b svg{width:15px;height:15px;color:var(--accent)}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
.input,select.input,textarea.input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 14px;font-family:inherit;font-size:.92rem;transition:.25s}
.input:focus{border-color:var(--accent);outline:none}
textarea.input{min-height:110px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}}
.skel{background:linear-gradient(90deg,#141926 25%,#1c2333 50%,#141926 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r)}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty svg{width:64px;height:64px;color:var(--line);margin-bottom:14px}
.footer{border-top:1px solid var(--line);background:var(--card);padding:22px 0;margin-top:40px}
.footer-in{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.footer-engineer{display:flex;align-items:center;gap:12px}
.footer-engineer .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#8b0000);display:grid;place-items:center;color:#fff;font-weight:800}
.footer-engineer .info b{display:block;font-size:.92rem;color:var(--text)}
.footer-engineer .info small{font-size:.72rem;color:var(--muted)}
.footer small{color:var(--muted)}
.socials{display:flex;gap:10px}
.socials a{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:.25s}
.socials a:hover{color:var(--accent);border-color:var(--accent)}
.socials svg{width:18px;height:18px}

/* ================= عارض الصور و 3D ================= */
.lightbox{position:fixed;inset:0;z-index:9999;background:rgba(5,7,10,.97);display:none;align-items:center;justify-content:center;touch-action:none;user-select:none}
.lightbox.active{display:flex}
.lightbox img{max-width:90vw;max-height:84vh;object-fit:contain;cursor:grab;transition:transform .12s ease-out;border-radius:8px;pointer-events:auto}
.lightbox canvas{max-width:92vw;max-height:85vh;border-radius:10px;border:1px solid var(--line);cursor:grab;box-shadow:0 0 40px rgba(0,0,0,.8)}
.lb-btn{position:absolute;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(20,25,35,.85);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:10001;transition:.2s}
.lb-btn:hover{background:var(--accent);border-color:var(--accent)}
.lb-btn svg{width:22px;height:22px}
.lb-close{top:20px;inset-inline-end:20px}
.lb-prev{top:50%;transform:translateY(-50%);inset-inline-start:20px}
.lb-next{top:50%;transform:translateY(-50%);inset-inline-end:20px}
.lb-zoom{bottom:20px;inset-inline-start:20px;display:flex;gap:10px;z-index:10001}
.lb-count{position:absolute;top:24px;inset-inline-start:24px;color:#fff;font-size:.9rem;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:99px;border:1px solid var(--line);z-index:10001}
.lb-tip{position:absolute;bottom:24px;inset-inline-end:24px;color:var(--muted);font-size:.8rem;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:99px;pointer-events:none}

#botIcon{position:fixed;z-index:120;width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;cursor:grab;touch-action:none;transition:box-shadow .25s}
#botIcon:active{cursor:grabbing}
#botIcon svg{width:28px;height:28px}
#botIcon:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
#botBubble{position:fixed;z-index:119;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-size:.8rem;color:var(--text);box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:.3s;pointer-events:none;white-space:nowrap}
#botBubble.show{opacity:1;transform:translateY(0)}
#botWin{position:fixed;z-index:130;width:min(370px,calc(100vw - 20px));height:min(560px,72vh);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.bot-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.bot-head .av{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--accent) 15%,transparent);display:grid;place-items:center;color:var(--accent)}
.bot-head h4{margin:0;font-size:.95rem}
.bot-head small{color:var(--muted);font-size:.7rem}
.bot-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bot-msg{max-width:85%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:.86rem;white-space:pre-wrap}
.bot-msg.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 18%,var(--bg));border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.bot-chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px}
.palette-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.25s}
.palette-card:hover{border-color:var(--accent)}
.palette-card h5{margin:0 0 8px;font-size:.88rem}
.swatches{display:flex;gap:6px;margin-bottom:8px}
.swatches i{width:26px;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.12)}
.palette-card p{margin:3px 0;font-size:.72rem;color:var(--muted)}
.palette-card p b{color:var(--text);font-weight:600}
.admin{display:grid;grid-template-columns:230px 1fr;gap:20px;padding:24px 0;min-height:80vh}
@media(max-width:900px){.admin{grid-template-columns:1fr}}
.admin-side{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;height:fit-content;position:sticky;top:80px}
@media(max-width:900px){.admin-side{position:static;display:flex;overflow-x:auto;gap:6px}}
.admin-side button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;border:none;background:none;border-radius:10px;color:var(--muted);cursor:pointer;font-size:.88rem;font-weight:600;transition:.25s;white-space:nowrap}
.admin-side button svg{width:18px;height:18px}
.admin-side button.active,.admin-side button:hover{background:var(--bg);color:var(--text)}
.admin-side button.active{color:var(--accent)}
.admin-main{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.admin-table{width:100%;border-collapse:collapse;font-size:.86rem}
.admin-table th,.admin-table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
.admin-table th{color:var(--muted);font-weight:600;font-size:.75rem}
.admin-table tr[draggable]{cursor:grab}
.admin-table tr.dragover{outline:1px dashed var(--accent)}
.row-imgs{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.row-imgs figure{margin:0;position:relative;width:110px}
.row-imgs img{width:110px;height:80px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:grab}
.row-imgs figure.cover img{border-color:var(--accent)}
.row-imgs .img-tools{display:flex;gap:4px;margin-top:4px;justify-content:center}
.mini-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.2s}
.mini-btn:hover{color:var(--accent);border-color:var(--accent)}
.mini-btn svg{width:14px;height:14px}
.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);cursor:pointer;transition:.25s;font-size:.88rem}
.dropzone.over,.dropzone:hover{border-color:var(--accent);color:var(--text)}
.progress{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
.badge{font-size:.68rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.pub{color:#7ee2a8;border-color:#1d4a33}.badge.draft{color:#ffd47e;border-color:#5b4a1d}
.login-box{max-width:400px;margin:70px auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:30px}
.pw-wrap{position:relative}.pw-wrap .input{padding-inline-end:44px}
.pw-wrap button{position:absolute;inset-inline-end:6px;top:6px;bottom:6px;width:34px;border:none;background:none;color:var(--muted);cursor:pointer}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center}
.stat-card svg{width:22px;height:22px;color:var(--accent);margin:0 auto 6px;display:block}
.stat-card b{font-size:1.6rem;color:var(--accent);display:block}
.stat-card span{font-size:.75rem;color:var(--muted)}
.msg-item{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.msg-item.unread{border-color:var(--accent)}
.range-row{display:flex;align-items:center;gap:12px}
input[type=range]{accent-color:var(--accent);flex:1}
.color-dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;display:inline-block}
.color-dot.sel{border-color:#fff}
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
@media(max-width:900px){.about-grid{grid-template-columns:1fr}}
.about-img{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3}
.about-img img{width:100%;height:100%;object-fit:cover}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.stats-row .stat-card b{font-size:1.7rem}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:900px){.contact-grid{grid-template-columns:1fr}}
.c-item{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.c-item .ic{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.c-item .ic svg{width:19px;height:19px}
.c-item small{color:var(--muted);display:block;font-size:.72rem}
.toasts{position:fixed;bottom:86px;inset-inline-start:50%;transform:translateX(50%);z-index:190;display:flex;flex-direction:column;gap:8px;align-items:center}
@media(min-width:821px){.toasts{bottom:24px}}
.toast{background:var(--card);border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:10px;padding:10px 18px;font-size:.85rem;box-shadow:var(--shadow);animation:tin .3s ease}
.toast.err{border-inline-start-color:#ff5c5c}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

async function getAllDesigns(){
  if(_allDesignsCache) return _allDesignsCache;

  _allDesignsPromise=(async()=>{
    const F=await fb();
    const adminSession=!!sessionStorage.getItem("ap_isadmin");
    const snap=adminSession
      ? await F.getDocs(F.collection(F.db,"designs"))

const canWebP=()=>document.createElement("canvas").toDataURL("image/webp").indexOf("data:image/webp")===0;
const IMG_TYPE=canWebP()?"image/webp":"image/jpeg";
const loadFile=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
const drawImg=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u;});
async function compress(dataUrl,{maxDim=1600,quality=0.82,watermark=false}={}){
  const img=await drawImg(dataUrl);
  let w=img.width,h=img.height;
  const sc=Math.min(1,maxDim/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,w,h);
  if(watermark&&settings.watermark?.enabled){
    const txt=settings.watermark.text||settings.siteName||"";
    if(txt){ctx.font=`bold ${Math.max(16,Math.round(w/28))}px ${settings.font||"Cairo"}, sans-serif`;ctx.textAlign="right";ctx.textBaseline="bottom";ctx.fillStyle="rgba(255,255,255,.30)";ctx.shadowColor="rgba(0,0,0,.5)";ctx.shadowBlur=6;ctx.fillText(txt,w-16,h-12);}
  }
  const out=c.toDataURL(IMG_TYPE,quality);
  return {data:out,width:w,height:h,size:bytes(out)};
}
async function compressToFit(file,{maxDim=1600,quality=0.82,watermark=false}={}){
  const src=await loadFile(file);
  let out=await compress(src,{maxDim,quality,watermark}), q=quality, dim=maxDim;
  for(let i=0;i<6&&out.size>900*1024;i++){q=Math.max(0.45,q-0.1);dim=Math.round(dim*0.85);out=await compress(src,{maxDim:dim,quality:q,watermark});}
  out.saved=Math.max(0,Math.round((1-out.size/file.size)*100));
  return out;
}
const thumbOf=(fOrD,wm=false)=>typeof fOrD==="string"?compress(fOrD,{maxDim:480,quality:0.75,watermark:wm}):compressToFit(fOrD,{maxDim:480,quality:0.75,watermark:wm});

  },
  async getImageUrl(designId,imgId){
    const ck=`img_${designId}_${imgId}`; if(window[ck])return window[ck];
    const {db,doc,getDoc,collection,getDocs}=await fb();
    const snap=await getDoc(doc(db,"designs",designId,"images",imgId));
    if(!snap.exists())return "";
    const d=snap.data(); let url=d.data||d.imageUrl||"";
    if(d.chunked){const cs=await getDocs(collection(db,"designs",designId,"images",imgId,"chunks"));url=`data:${d.mime};base64,`+cs.docs.map(x=>x.data().data).sort((a,b)=>a.i-b.i).map(x=>x.data).join("");}
    window[ck]=url; return url;
  },
  async deleteImage(designId,imgId){
    const {db,doc,deleteDoc,collection,getDocs}=await fb();
    try{const cs=await getDocs(collection(db,"designs",designId,"images",imgId,"chunks"));for(const c of cs.docs)await deleteDoc(c.ref);}catch{}
    await deleteDoc(doc(db,"designs",designId,"images",imgId));
  },
  async listMeta(designId){
    const {db,collection,getDocs}=await fb();
    const s=await getDocs(collection(db,"designs",designId,"images"));
    return s.docs.map(dd=>({id:dd.id,...dd.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
  }
};
const FirebaseStorageAdapter={
  async saveImage(designId,{data,width,height,size},order){
    const F=await fb(); const imgId=uid();
    const bin=await (await fetch(data)).blob();
    const ref=F.storageApi.ref(F.storage,`designs/${designId}/${imgId}`);
    await F.storageApi.uploadBytes(ref,bin,{contentType:bin.type});
    const imageUrl=await F.storageApi.getDownloadURL(ref);
    await F.setDoc(F.doc(F.db,"designs",designId,"images",imgId),{imageUrl,order,width,height,size,createdAt:Date.now()});
    return imgId;
  },
  async getImageUrl(designId,imgId){const m=(await this.listMeta(designId)).find(x=>x.id===imgId);return m?.imageUrl||"";},
  async deleteImage(designId,imgId){const F=await fb();await F.deleteDoc(F.doc(F.db,"designs",designId,"images",imgId));},
  listMeta:Base64FirestoreAdapter.listMeta
};
const storage=appConfig.storageMode==="storage"?FirebaseStorageAdapter:Base64FirestoreAdapter;

let myLikes=new Set(), _anon=undefined;
async function ensureAnon(){
  if(_anon!==undefined)return _anon;
  _anon=await (async()=>{try{const {auth,signInAnonymously}=await fb();if(auth.currentUser)return auth.currentUser.uid;const c=await signInAnonymously(auth);return c.user.uid;}catch(e){return null;}})();
  return _anon;
}
async function loadMyLikes(){
  const u=await ensureAnon(); if(!u)return myLikes;
  const {db,collection,query,where,getDocs}=await fb();
  const s=await getDocs(query(collection(db,"likes"),where("uid","==",u)));
  myLikes=new Set(s.docs.map(dd=>dd.data().designId));
  return myLikes;
}
const hasLiked=id=>myLikes.has(id);
function bindLikeButtons(root){
  root.querySelectorAll("[data-like]").forEach(btn=>{
    const id=btn.dataset.like; paintLike(btn,id);
    btn.onclick=e=>{e.preventDefault();e.stopPropagation();toggleLike(id,btn,root.querySelector(`[data-likecount="${id}"]`));};
  });
}
function paintLike(btn,id){
  const liked=myLikes.has(id);
  btn.classList.toggle("liked",liked);
  btn.innerHTML=icon(settings.likeIcon==="star"?"star":"heart");
  btn.setAttribute("aria-pressed",liked);
  btn.setAttribute("aria-label",liked?"إلغاء الإعجاب":"إعجاب");
}
async function toggleLike(id,btn,countEl){
  const u=await ensureAnon();
  if(!u){toast("يرجى تفعيل الزائر المجهول في Authentication في Firebase","err");return;}
  const liked=myLikes.has(id);
  liked?myLikes.delete(id):myLikes.add(id);
  paintLike(btn,id); btn.classList.add("pulse"); setTimeout(()=>btn.classList.remove("pulse"),500);
  if(countEl)countEl.textContent=Math.max(0,(+countEl.textContent||0)+(liked?-1:1));
  try{
    const {db,doc,runTransaction}=await fb();
    await runTransaction(db,async t=>{
      const dRef=doc(db,"designs",id), lRef=doc(db,"likes",`${id}_${u}`);
      const d=await t.get(dRef), l=await t.get(lRef);
      const c=d.data()?.likesCount||0;
      if(l.exists()){t.delete(lRef);t.update(dRef,{likesCount:Math.max(0,c-1)});}
      else{t.set(lRef,{designId:id,uid:u,createdAt:Date.now()});t.update(dRef,{likesCount:c+1});}
    });
    invalidateDesignsCache();
  }catch(e){
    liked?myLikes.add(id):myLikes.delete(id);
    paintLike(btn,id); if(countEl)countEl.textContent=Math.max(0,(+countEl.textContent||0)+(liked?1:-1));
    toast("تعذر تسجيل الإعجاب","err");
  }
}

let lbImgs=[], lbIdx=0, lbScale=1, lbTx=0, lbTy=0;
let is3DMode=false, anim3DId=null;

function closeLightbox(e){
  if(e){e.preventDefault(); e.stopPropagation();}
  if(anim3DId){cancelAnimationFrame(anim3DId); anim3DId=null;}
  const lb=$("#lightbox");
  lb.classList.remove("active");
  lb.innerHTML="";
  document.body.classList.remove("modal-open");
  document.onkeydown=null;
}

function openLightbox(list, start=0, as3D=false){
  if(!list||!list.length) return;
  lbImgs=list; lbIdx=Math.max(0,Math.min(start,list.length-1));
  lbScale=1; lbTx=lbTy=0; is3DMode=as3D;
  document.body.classList.add("modal-open");

  const lb=$("#lightbox");
  lb.classList.add("active");

  lb.innerHTML=`
    <button class="lb-btn lb-close" id="lbCloseBtn" aria-label="إغلاق">${icon("close")}</button>
    <button class="lb-btn lb-prev" id="lbPrevBtn" aria-label="السابق">${icon("chevR")}</button>
    <button class="lb-btn lb-next" id="lbNextBtn" aria-label="التالي">${icon("chevL")}</button>
    <div class="lb-zoom">
      <button class="lb-btn" id="lbIn" aria-label="تكبير">${icon("zoomin")}</button>
      <button class="lb-btn" id="lbOut" aria-label="تصغير">${icon("zoomout")}</button>
    </div>
    <span class="lb-count" id="lbCounter"></span>
    <span class="lb-tip">${as3D ? "وضع الاستعراض ثلاثي الأبعاد — اسحب للتدوير" : "استخدم الأسهم للتنقل أو اسحب يميناً ويساراً"}</span>
    <div id="lbCanvasWrap" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;pointer-events:none"></div>
  `;

  $("#lbCloseBtn").onclick=closeLightbox;
  $("#lbPrevBtn").onclick=(e)=>{e.stopPropagation(); lbStep(-1);};
  $("#lbNextBtn").onclick=(e)=>{e.stopPropagation(); lbStep(1);};
  $("#lbIn").onclick=(e)=>{e.stopPropagation(); lbSetScale(lbScale*1.25);};
  $("#lbOut").onclick=(e)=>{e.stopPropagation(); lbSetScale(lbScale/1.25);};

  document.onkeydown=e=>{
    if(e.key==="Escape"){closeLightbox(); return;}
    if(e.key==="ArrowRight"||e.key==="ArrowUp") lbStep(-1);
    if(e.key==="ArrowLeft"||e.key==="ArrowDown") lbStep(1);
  };

  lbRenderView();
}

function lbSetScale(s){
  lbScale=Math.min(4,Math.max(0.8,s));
  if(lbScale===1){lbTx=0; lbTy=0;}
  applyTransform();
}

function applyTransform(){
  const el=$("#lbCanvasWrap > *");
  if(el) el.style.transform=`translate(${lbTx}px, ${lbTy}px) scale(${lbScale})`;
}

function lbStep(d){
  lbIdx=(lbIdx+d+lbImgs.length)%lbImgs.length;
  lbScale=1; lbTx=0; lbTy=0;
  lbRenderView();
}

function lbRenderView(){
  const wrap=$("#lbCanvasWrap");
  if(!wrap) return;
  wrap.innerHTML="";
  $("#lbCounter").textContent=`${lbIdx+1} / ${lbImgs.length}`;

  if(anim3DId){cancelAnimationFrame(anim3DId); anim3DId=null;}

  if(is3DMode){
    // إنشاء نموذج 3D تفاعلي بـ Canvas
    const cv=document.createElement("canvas");
    cv.width=900; cv.height=600;
    cv.style.pointerEvents="auto";
    wrap.appendChild(cv);
    initInteractive3D(cv, lbImgs[lbIdx]);
  }else{
    const img=document.createElement("img");
    img.src=lbImgs[lbIdx];
    img.alt="صورة التصميم";
    img.draggable=false;
    img.style.pointerEvents="auto";
    img.onerror=()=>{img.onerror=null; img.src=fallbackScene();};
    wrap.appendChild(img);
    initInteractiveImage(img);
  }
}

function initInteractiveImage(img){
  let startX=0, startY=0, isDown=false;
  img.onpointerdown=e=>{
    isDown=true; startX=e.clientX-lbTx; startY=e.clientY-lbTy;
    img.setPointerCapture(e.pointerId);
    img.style.cursor="grabbing";
  };
  img.onpointermove=e=>{
    if(!isDown) return;
    if(lbScale>1){
      lbTx=e.clientX-startX;
      lbTy=e.clientY-startY;
      applyTransform();
    }
  };
  img.onpointerup=img.onpointercancel=e=>{
    if(!isDown) return;
    isDown=false;
    img.style.cursor="grab";
    const movedX=e.clientX-(startX+lbTx);
    if(lbScale<=1 && Math.abs(movedX)>60){
      lbStep(movedX>0 ? -1 : 1);
    }
  };
}

/* محاكاة تفاعلية لعرض 3D للمساحات المعمارية باستخدام Canvas بدون مكتبات خارجية */
function initInteractive3D(canvas, texUrl){
  const ctx=canvas.getContext("2d");
  let rotY=0, rotX=0.2, isDown=false, lx=0, ly=0;
  const tex=new Image();
  tex.crossOrigin="anonymous";
  tex.src=texUrl;
  tex.onerror=()=>{tex.src=fallbackScene();};

  canvas.onpointerdown=e=>{
    isDown=true; lx=e.clientX; ly=e.clientY;
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor="grabbing";
  };
  canvas.onpointermove=e=>{
    if(!isDown) return;
    const dx=e.clientX-lx, dy=e.clientY-ly;
    rotY += dx*0.01;
    rotX = Math.max(-0.6, Math.min(0.6, rotX + dy*0.01));
    lx=e.clientX; ly=e.clientY;
  };
  canvas.onpointerup=canvas.onpointercancel=()=>{
    isDown=false; canvas.style.cursor="grab";
  };

  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const w=canvas.width, h=canvas.height, cx=w/2, cy=h/2;

    // خلفية المشهد الهندسي 3D
    const grad=ctx.createRadialGradient(cx,cy,50,cx,cy,w/1.5);
    grad.addColorStop(0,"#1A202C");
    grad.addColorStop(1,"#0B0E14");
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,w,h);

    // رسم شبكة معمارية ثلاثية الأبعاد (Architectural Grid)
    ctx.strokeStyle="rgba(225,6,0,0.25)";
    ctx.lineWidth=1;
    const gridCount=10, size=300;
    for(let i=-gridCount; i<=gridCount; i++){
      const z0=i*(size/gridCount);
      // خطوط أفقية بالأبعاد الثلاثية
      const p1=project3D(-size, 150, z0, rotX, rotY, cx, cy);
      const p2=project3D(size, 150, z0, rotX, rotY, cx, cy);
      if(p1&&p2){ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();}
    }

    // عرض لوحة التصميم داخل البيئة ثلاثية الأبعاد
    const panelW=260, panelH=180;
    const c1=project3D(-panelW, -panelH, 0, rotX, rotY, cx, cy);
    const c2=project3D(panelW, -panelH, 0, rotX, rotY, cx, cy);
    const c3=project3D(panelW, panelH, 0, rotX, rotY, cx, cy);
    const c4=project3D(-panelW, panelH, 0, rotX, rotY, cx, cy);

    if(c1&&c2&&c3&&c4){
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(c1.x,c1.y); ctx.lineTo(c2.x,c2.y); ctx.lineTo(c3.x,c3.y); ctx.lineTo(c4.x,c4.y);
      ctx.closePath();
      ctx.strokeStyle="var(--accent)";
      ctx.lineWidth=3;
      ctx.stroke();

      if(tex.complete && tex.naturalWidth>0){
        ctx.clip();
        ctx.drawImage(tex, c1.x, c1.y, (c2.x-c1.x)||300, (c4.y-c1.y)||200);
      } else {
        ctx.fillStyle="#1E2430";
        ctx.fill();
      }
      ctx.restore();
    }

    // دوران خفيف تلقائي عند التوقف
    if(!isDown) rotY += 0.003;
    anim3DId=requestAnimationFrame(render);
  }

  function project3D(x,y,z,rx,ry,cx,cy){
    const cosY=Math.cos(ry), sinY=Math.sin(ry);
    const x1=x*cosY + z*sinY;
    const z1=-x*sinY + z*cosY;

    const cosX=Math.cos(rx), sinX=Math.sin(rx);
    const y2=y*cosX - z1*sinX;
    const z2=y*sinX + z1*cosX;

    const dist=550;
    if(z2 + dist <= 10) return null;
    const fov=dist/(z2+dist);
    return {x: cx + x1*fov, y: cy + y2*fov};
  }

  anim3DId=requestAnimationFrame(render);
}

async function pReset(){pState.items=[];pState.page=0;pState.done=false;invalidateDesignsCache();$("#pGrid").innerHTML=skeletonGrid(appConfig.pageSize);await fetchPage();}
const catIdBySlug=slug=>store.categories.find(c=>c.slug===slug)?.id||"";
async function fetchPage(){
  if(pState.loading||pState.done)return; pState.loading=true;
  const all=await getAllDesigns();
  let pool=all.filter(dd=>dd.status==="published");
  if(pState.cat) pool=pool.filter(dd=>dd.categoryId===catIdBySlug(pState.cat));
  if(pState.color) pool=pool.filter(dd=>(dd.colorTags||[]).includes(pState.color));
  if(pState.q){
    const q=pState.q.toLowerCase();
    pool=pool.filter(dd=>(dd.title||"").toLowerCase().includes(q)||(dd.tags||[]).some(t=>(t||"").toLowerCase().includes(q))||store.catName(dd.categoryId).toLowerCase().includes(q));
  }
  const orderF=pState.sort==="likes"?"likesCount":"createdAt";
  pool.sort((a,b)=>(b[orderF]||0)-(a[orderF]||0));
  const start=pState.page*appConfig.pageSize, end=start+appConfig.pageSize;
  const slice=pool.slice(start,end);
  pState.items.push(...slice);
  if(slice.length<appConfig.pageSize||end>=pool.length) pState.done=true;
  pState.page++;
  paintGrid(); pState.loading=false;
}
function paintGrid(){
  const g=$("#pGrid");
  g.innerHTML=pState.items.length?`<div class="grid">${pState.items.map(dd=>designCard(dd,store.catName(dd.categoryId))).join("")}</div>`:emptyState("لا توجد تصاميم مطابقة للبحث");
  bindCards(g); $("#more").hidden=pState.done;
}

const GREET=["السلام عليكم ورحمة الله وبركاته","معك المساعد المعماري الافتراضي","أهلاً بك في منصة م. مهند","ما هو نوع المشروع الذي ترغب في استعراضه؟"];
let botOpen=false, botState=null, bubbleTimer=null;
function initBot(){
  const root=$("#botRoot");
  root.innerHTML=`<div id="botBubble"></div><button id="botIcon" aria-label="المساعد المعماري">${icon("cube")}</button>`;
  const ic=$("#botIcon");
  placeIcon(ic); makeDraggable(ic);
  ic.addEventListener("click",()=>{if(ic.dataset.dragged==="1"){ic.dataset.dragged="0";return;}botToggle(true);});
  window.addEventListener("resize",()=>placeIcon(ic));
}
function placeIcon(ic){
  let p;try{p=JSON.parse(localStorage.getItem("ap_bot_pos"));}catch{}
  const m=10,S=52;
  let x=p?.x??m, y=p?.y??(innerHeight-S-m-(innerWidth<=820?62:0));
  x=Math.min(Math.max(m,x),innerWidth-S-m); y=Math.min(Math.max(m,y),innerHeight-S-m);
  ic.style.left=x+"px"; ic.style.top=y+"px";
}
function makeDraggable(ic){
  let sx,sy,ox,oy,moved;
  ic.addEventListener("pointerdown",e=>{moved=false;sx=e.clientX;sy=e.clientY;ox=ic.offsetLeft;oy=ic.offsetTop;ic.setPointerCapture(e.pointerId);
    const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(!moved)return;const m=10,S=52;
      ic.style.left=Math.min(Math.max(m,ox+dx),innerWidth-S-m)+"px";
      ic.style.top=Math.min(Math.max(m,oy+dy),innerHeight-S-m)+"px";};
    const up=()=>{ic.removeEventListener("pointermove",mv);ic.removeEventListener("pointerup",up);
      if(moved){ic.dataset.dragged="1";localStorage.setItem("ap_bot_pos",JSON.stringify({x:ic.offsetLeft,y:ic.offsetTop}));}};
    ic.addEventListener("pointermove",mv); ic.addEventListener("pointerup",up);});
}
function botToggle(toOpen){
  botOpen=toOpen;
  if(botOpen){ensureWin();botGreet();}

function ensureWin(){

  w.style.top=Math.max(10,ic.offsetTop-570)+"px";

  $("#botRoot").appendChild(w);

}
async function botSay(text,me=false){
  const body=$("#botBody"); if(!body)return;
  const m=document.createElement("div"); m.className="bot-msg"+(me?" me":""); body.appendChild(m); body.scrollTop=body.scrollHeight;
  if(me){m.textContent=text; return;}
  for(const ch of text){m.textContent+=ch; body.scrollTop=body.scrollHeight; await wait(8);}
}

      <button class="btn" style="width:100%;justify-content:center;margin-top:10px" type="submit">تسجيل الدخول والتحقق</button>

    </form>
  </div>`;

  $("#eye").onclick=()=>{const p=$("#pw");const show=p.type==="password";p.type=show?"text":"password";$("#eye").innerHTML=icon(show?"eyeoff":"eye");};
  $("#fp").onclick=async()=>{
    const em=$("#em").value.trim(); if(!em)return toast("اكتب بريدك أولاً","err");
    const F=await fb();
    try{await F.sendPasswordResetEmail(F.auth,em); toast("تم إرسال رابط الاستعادة");}catch(e){toast("خطأ في الإرسال","err");}
  };
  $("#lf").onsubmit=async e=>{
    e.preventDefault();
    const F=await fb();
    const em=$("#em").value.trim(), pw=$("#pw").value;
    try{
      const cred=await F.signInWithEmailAndPassword(F.auth, em, pw);
      const isAdm=await checkIsAdmin(cred.user.uid);
      if(!isAdm){
        sessionStorage.removeItem("ap_isadmin");
        loginView(root, "تم تسجيل الدخول لكن UID الخاص بك ("+cred.user.uid+") غير مدرج في Firestore داخل مجموعة admins.");
      }else{
        sessionStorage.setItem("ap_isadmin", cred.user.uid);
        invalidateDesignsCache();
        toast("أهلاً بك م. مهند");
        adminShell(root);
      }
    }catch(err){
      loginView(root, "فشل تسجيل الدخول: تحقق من صحة البريد وكلمة المرور.");
    }
  };
}

function adminShell(root){

    <aside class="admin-side" id="aSide">
      ${SECTIONS.map(([k,ic,label])=>`<button data-k="${k}" class="${k===aSec?"active":""}">${icon(ic)} ${label}</button>`).join("")}

async function editor(m,d){
  d=d?{...d}:{title:"",categoryId:store.categories[0]?.id||"",description:"",specs:[],year:new Date().getFullYear(),area:"",materials:"",location:"",software:"3ds Max",tags:[],colorTags:[],status:"published",featured:false};
  m.innerHTML=`<button class="back-link" id="backL">${icon("chevR")} رجوع للتصاميم</button>
  <h2>${d.title?"تعديل التصميم":"تصميم معماري جديد"}</h2>
  <div class="form-grid">
    <div class="field"><label>عنوان التصميم *</label><input class="input" id="fTitle" value="${esc(d.title)}"></div>
    <div class="field"><label>التصنيف</label><select class="input" id="fCat">${store.categories.map(c=>`<option value="${c.id}" ${c.id===d.categoryId?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
    <div class="field"><label>سنة التنفيذ</label><input class="input" id="fYear" value="${esc(d.year||"")}"></div>
    <div class="field"><label>المساحة</label><input class="input" id="fArea" value="${esc(d.area||"")}"></div>
    <div class="field"><label>المدينة / الموقع</label><input class="input" id="fLoc" value="${esc(d.location||"")}"></div>
    <div class="field"><label>البرامج</label><input class="input" id="fSoft" value="${esc(d.software||"3ds Max")}"></div>
  </div>
  <div class="field"><label>الخامات</label><input class="input" id="fMat" value="${esc(d.materials||"")}"></div>
  <div class="field"><label>الوصف المعماري</label><textarea class="input" id="fDesc">${esc(d.description||"")}</textarea></div>
  <label style="display:flex;gap:8px;font-size:.85rem;margin-bottom:14px"><input type="checkbox" id="fPub" ${d.status==="published"?"checked":""}> منشور للزوار</label>
  <h3>الصور المعمارية</h3>
  <div class="dropzone" id="dz">اضغط أو اسحب الصور هنا (تأكد من خلوها من أي صور أو مجسمات لذوات الأرواح)</div>
  <input type="file" id="fFiles" accept="image/*" multiple hidden>
  <div class="row-imgs" id="imgList"></div>
  <div style="margin-top:16px;display:flex;gap:10px"><button class="btn" id="saveD">${icon("check")} حفظ التصميم</button></div>`;

  $("#backL").onclick=()=>secDesigns(m);
  let pending=[], existing=d.id?await Base64FirestoreAdapter.listMeta(d.id):[];
  const drawImgs=()=>{
    $("#imgList").innerHTML=existing.map(im=>`<figure><img src="${im.thumb||im.imageUrl||""}"></figure>`).join("")+
      pending.map(p=>`<figure><img src="${p.preview}"></figure>`).join("");
  };
  drawImgs();

  $("#dz").onclick=()=>$("#fFiles").click();
  $("#fFiles").onchange=async e=>{
    for(const f of e.target.files){
      const c=await compressToFit(f,{watermark:false});
      const t=await thumbOf(f,false);
      pending.push({preview:URL.createObjectURL(f), compressed:c, thumb:t.data});
    }
    drawImgs();
  };

  $("#saveD").onclick=async()=>{
    const title=$("#fTitle").value.trim();
    if(!title) return toast("يرجى كتابة العنوان","err");
    const F=await fb();
    const data={
      title, categoryId:$("#fCat").value, description:$("#fDesc").value,
      year:$("#fYear").value, area:$("#fArea").value, location:$("#fLoc").value,
      software:$("#fSoft").value, materials:$("#fMat").value,
      status:$("#fPub").checked?"published":"draft", updatedAt:Date.now()
    };
    let id=d.id;
    if(!id){
      const ref=await F.addDoc(F.collection(F.db,"designs"),{...data,likesCount:0,viewsCount:0,imagesCount:0,createdAt:Date.now()});
      id=ref.id;
    }else{
      await F.updateDoc(F.doc(F.db,"designs",id),data);
    }
    let firstThumb=d.thumbnail||"";
    for(let i=0;i<pending.length;i++){
      const p=pending[i];
      const imgId=await storage.saveImage(id,p.compressed,existing.length+i);
      await F.updateDoc(F.doc(F.db,"designs",id,"images",imgId),{thumb:p.thumb});
      if(!firstThumb) firstThumb=p.thumb;
    }
    if(firstThumb) await F.updateDoc(F.doc(F.db,"designs",id),{thumbnail:firstThumb});
    invalidateDesignsCache(); toast("تم الحفظ بنجاح"); secDesigns(m);
  };
}
